name: Lua tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1
      - name: Run Lua tests
        run: lua5.1 tests/run.lua
